<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>옛날 vs 오늘날 풍습 탐험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --paper:#f6efe0; --paper2:#fffaf0; --ink:#2b2622; --muted:#6f655b; --line:#e2d6bf;
    --red:#b5432f; --red-soft:#f6e1da; --blue:#2d5d8a; --blue-soft:#dfeaf4;
    --green:#2f6b55; --green-soft:#ddeee6; --gold:#c8962e; --gold-soft:#f7ecd2;
    --radius:16px; --shadow:0 2px 10px rgba(60,40,20,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.6;min-height:100vh}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}

  header{background:var(--ink);color:#fff;padding:14px 0;position:sticky;top:0;z-index:20}
  header .wrap{display:flex;align-items:center;gap:12px;padding-bottom:0;flex-wrap:wrap}
  .logo{font-family:'Gowun Dodum',sans-serif;font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
  .logo .seal{width:34px;height:34px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-size:18px}
  .logo small{font-size:13px;opacity:.7;font-family:'Noto Sans KR';font-weight:400}
  .spacer{flex:1}
  .who{font-size:14px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px}
  .who button{background:none;border:none;color:#ffd9a8;text-decoration:underline;margin-left:6px;font-size:13px}
  .status{font-size:13px;padding:5px 12px;border-radius:999px;background:#555;white-space:nowrap}
  .status.ok{background:var(--green)} .status.err{background:var(--red)} .status.wait{background:#7a6a4f}

  .login{max-width:460px;margin:48px auto;background:var(--paper2);border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:var(--shadow);text-align:center}
  .login h2{font-family:'Gowun Dodum';font-size:26px;margin-bottom:6px}
  .login p{color:var(--muted);margin-bottom:22px}
  .login .row{display:flex;gap:10px;margin-bottom:12px}
  .login input,.login select{flex:1;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:18px;min-width:0}
  .teacher-link{display:inline-block;margin-top:18px;background:none;border:none;color:var(--muted);text-decoration:underline;font-size:14px}

  .btn{border:none;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--ink);color:#fff;transition:transform .08s, opacity .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.red{background:var(--red)} .btn.blue{background:var(--blue)} .btn.green{background:var(--green)} .btn.gold{background:var(--gold)}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
  .btn.danger{background:transparent;color:var(--red);border:2px solid var(--red-soft)}
  .btn.big{width:100%;padding:14px;font-size:18px;justify-content:center}
  .btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
  .btn.xs{padding:3px 10px;font-size:12.5px;border-radius:8px}

  .tabs{display:flex;gap:8px;margin:20px 0 14px;flex-wrap:wrap}
  .tab{flex:1;min-width:150px;border:2px solid var(--line);background:var(--paper2);border-radius:14px;padding:10px 12px;text-align:left}
  .tab b{display:block;font-size:17px}
  .tab span{font-size:13px;color:var(--muted)}
  .tab.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .tab.on span{color:#e9dfcf}

  .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
  .chips .lbl{font-weight:600;margin-right:4px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-size:16px}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff}
  .chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:middle}
  .searchbox{display:flex;gap:6px;margin-left:auto;flex:1;min-width:220px;max-width:340px}
  .searchbox input{flex:1;min-width:0;padding:8px 12px;border:2px solid var(--line);border-radius:999px;background:#fff}

  .grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:16px}
  @media (max-width:860px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .card h3{font-family:'Gowun Dodum';font-size:20px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h4.sub{font-family:'Gowun Dodum';font-size:17px;margin:18px 0 6px}
  .tag{font-size:12px;font-family:'Noto Sans KR';font-weight:600;padding:2px 10px;border-radius:999px}
  .tag.past{background:var(--gold-soft);color:#8a6416} .tag.today{background:var(--blue-soft);color:var(--blue)}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}

  .info-block{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;border-left:5px solid var(--gold)}
  .info-block.today{border-left-color:var(--blue)}
  .info-block h4{font-size:14px;color:var(--muted);margin-bottom:2px}
  .src-note{font-size:12.5px;color:var(--muted);margin-top:4px}

  .imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
  .imgcard{background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .imgcard.sel{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .imgcard img{width:100%;height:140px;object-fit:cover;background:#eee;display:block}
  .imgcard .cap{font-size:11.5px;color:var(--muted);padding:6px 8px;line-height:1.35;flex:1;word-break:break-all}
  .imgcard button{border:none;border-top:1px solid var(--line);background:var(--paper2);padding:7px;font-size:13px;font-weight:600}
  .imgcard.sel button{background:var(--green);color:#fff}
  .photo-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .filebtn{position:relative;overflow:hidden}
  .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

  .ask{display:flex;gap:6px;margin-top:6px}
  .ask input{flex:1;min-width:0;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
  .answer{background:var(--green-soft);border-radius:12px;padding:12px 14px;margin-top:8px;white-space:pre-wrap;font-size:15px}

  label.f{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-weight:600;margin:14px 0 4px}
  label.f small{font-weight:400;color:var(--muted)}
  textarea,.inp{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;resize:vertical}
  textarea:focus,.inp:focus,input:focus,select:focus{outline:none;border-color:var(--blue)}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .quick button{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted)}
  .quick .ai{border:none;background:var(--green);color:#fff;font-weight:600}
  .picked{display:flex;gap:10px;align-items:center;background:#fff;border:2px dashed var(--line);border-radius:12px;padding:8px;margin-top:4px;min-height:64px}
  .picked img{width:84px;height:60px;object-fit:cover;border-radius:8px}
  .picked .t{font-size:12.5px;color:var(--muted);flex:1;word-break:break-all}
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
  .saved{font-size:13px;color:var(--green);font-weight:600}
  .danger-zone{margin-top:18px;padding-top:12px;border-top:1px dashed var(--line);display:flex;gap:8px;flex-wrap:wrap}

  .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-top:16px}
  @media (max-width:760px){.vs{grid-template-columns:1fr}.vs .mid{display:none}}
  .vs .side{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
  .vs .side img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#eee;margin:8px 0}
  .vs .mid{display:grid;place-items:center;font-family:'Gowun Dodum';font-size:28px;color:var(--red)}
  .noimg{height:120px;display:grid;place-items:center;background:#f1ebde;border-radius:10px;color:var(--muted);margin:8px 0;font-size:14px}
  .frame{background:var(--gold-soft);border-radius:12px;padding:10px 14px;margin-top:6px;font-size:14px}

  /* 풍습 비교 카드 */
  .pcard{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:18px;color:var(--ink)}
  .pcard .ttl{font-family:'Gowun Dodum';font-size:24px;text-align:center;margin-bottom:12px}
  .pcard .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pcard .two > div{border-radius:12px;padding:8px 10px;font-size:14px}
  .pcard .two .p{background:var(--gold-soft)} .pcard .two .t{background:var(--blue-soft)}
  .pcard .two img{width:100%;height:150px;object-fit:cover;border-radius:8px;display:block;margin:6px 0}
  .pcard .two .ni{height:60px;display:grid;place-items:center;color:var(--muted);font-size:12px}
  .pcard .row{border-top:1px dashed var(--line);padding:7px 0;font-size:14px;display:flex;gap:8px}
  .pcard .row b{flex:0 0 96px}
  .pcard .foot{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}

  .copylist{margin-top:10px}
  .copylist .item{background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:8px}
  .copylist .item h5{font-size:13px;color:var(--muted);margin-bottom:4px}
  .copylist .sent{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-top:1px dashed #efe6d5;font-size:14px}
  .copylist .sent:first-of-type{border-top:none}
  .copylist .sent span{flex:1}
  details.box{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  details.box summary{font-weight:600;cursor:pointer}

  table.board{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;margin-top:10px}
  .board th,.board td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:15px}
  .board th{background:var(--ink);color:#fff;font-weight:600}
  .board td.l{text-align:left}
  .board tr:hover td{background:var(--paper2)}
  .ok{color:var(--green);font-weight:800} .no{color:#c9bca5}

  .modal{position:fixed;inset:0;background:rgba(30,20,10,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal.show{display:flex}
  .modal .box{background:var(--paper);border-radius:20px;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:18px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hide{display:none!important}
  .seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:8px 16px;font-weight:600}
  .seg button.on{background:var(--ink);color:#fff}
  #exportStage{position:fixed;left:-10000px;top:0;width:900px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo"><div class="seal">風</div>옛날 vs 오늘날 풍습 탐험 <small>3학년 UOI · 우리가 속한 시간과 공간</small></div>
    <div class="spacer"></div>
    <div class="who hide" id="who"></div>
    <div class="status wait" id="status">연결 중…</div>
  </div>
</header>

<div class="wrap">

  <section class="login" id="loginBox">
    <h2>탐험가 등록하기</h2>
    <p>반과 번호, 이름을 입력하면<br>5·6·7차시 조사 내용이 이어서 저장돼요.</p>
    <div class="row">
      <select id="inClass" aria-label="반"></select>
      <select id="inNo" aria-label="번호"></select>
    </div>
    <div class="row"><input id="inName" placeholder="이름" aria-label="이름"></div>
    <button class="btn red big" id="btnLogin">탐험 시작하기</button>
    <button class="teacher-link" id="btnTeacher">선생님 메뉴 (사진 관리)</button>
  </section>

  <section id="main" class="hide">
    <div class="tabs" id="tabs">
      <button class="tab" data-tab="today"><b>① 오늘날 풍습 조사</b><span>5차시</span></button>
      <button class="tab" data-tab="past"><b>② 옛날 풍습 조사</b><span>6차시</span></button>
      <button class="tab" data-tab="compare"><b>③ 두 시대 비교하기</b><span>7차시</span></button>
      <button class="tab" data-tab="board"><b>④ 우리 반 모아보기</b><span>함께 보기</span></button>
    </div>
    <div class="chips" id="chipBar">
      <span class="lbl">풍습 고르기</span>
      <span id="chips"></span>
      <div class="searchbox">
        <input id="inSearch" placeholder="다른 풍습 검색 (예: 설날)">
        <button class="btn sm" id="btnSearch">검색</button>
      </div>
    </div>
    <div id="view"></div>
  </section>

  <section id="teacher" class="hide"></section>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<div id="exportStage"></div>

function sbHeaders(extra){
  var h = {"apikey":SUPABASE_KEY, "Authorization":"Bearer "+SUPABASE_KEY};
  for (var k in (extra||{})) h[k] = extra[k];
  return h;
}
function sb(path, opts, ms){
  opts = opts || {};
  var h = sbHeaders({"Content-Type":"application/json"});
  if (opts.prefer) h["Prefer"] = opts.prefer;
  return fetchT(SUPABASE_URL + "/rest/v1/" + path, {method:opts.method||"GET", headers:h, body:opts.body ? JSON.stringify(opts.body) : undefined}, ms)
    .then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+" "+t); });
      if (r.status===204) return null;
      return r.text().then(function(t){ return t ? JSON.parse(t) : null; });
    });
}

/* 사진 올리기 (Supabase Storage) — 올리기 전에 크기를 줄여요 */
function resizeImage(file, max){
  max = max || 1280;
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight, r = Math.min(1, max/Math.max(w,h));
      var c = document.createElement("canvas"); c.width = Math.round(w*r); c.height = Math.round(h*r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ b ? resolve(b) : reject(new Error("사진을 읽지 못했어요.")); }, "image/jpeg", 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("사진 파일을 열 수 없어요.")); };
    img.src = url;
  });
}
function uploadImage(file, folder){
  return resizeImage(file).then(function(blob){
    var path = folder + "/" + Date.now() + "-" + Math.random().toString(36).slice(2,8) + ".jpg";
    return fetchT(SUPABASE_URL + "/storage/v1/object/" + BUCKET + "/" + path,
      {method:"POST", headers:sbHeaders({"Content-Type":"image/jpeg","x-upsert":"true"}), body:blob}, 30000)
      .then(function(r){
        if (!r.ok) return r.text().then(function(t){ throw new Error("올리기 실패 "+r.status); });
        return {path:path, url:SUPABASE_URL + "/storage/v1/object/public/" + BUCKET + "/" + path};
      });
  });
}
function removeStorage(path){
  if (!path) return Promise.resolve();
  return fetchT(SUPABASE_URL + "/storage/v1/object/" + BUCKET + "/" + path, {method:"DELETE", headers:sbHeaders()}).catch(function(){});
}

/* ================= Gemini ================= */
function callGemini(prompt, asJson){
  if (!GEMINI_KEY) return Promise.reject(new Error("AI 키를 불러오지 못했어요."));
  var i = 0;
  function tryNext(){
    if (i >= GEMINI_MODELS.length) return Promise.reject(new Error("AI가 지금 바빠요. 잠시 뒤에 다시 해 보세요."));
    var model = GEMINI_MODELS[i++];
    var url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + GEMINI_KEY;
    var cfg = {temperature:0.3};
    if (asJson) cfg.responseMimeType = "application/json";
    return fetchT(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({contents:[{parts:[{text:prompt}]}], generationConfig:cfg})}, 30000)
      .then(function(r){ if(!r.ok) throw new Error("model"); return r.json(); })
      .then(function(d){
        var t = d && d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts && d.candidates[0].content.parts.map(function(p){return p.text||"";}).join("");
        if (!t) throw new Error("empty");
        return t;
      })
      .catch(function(){ return tryNext(); });
  }
  return tryNext();
}
function parseJson(t){ return JSON.parse(t.trim().replace(/^```(json)?/i,"").replace(/```$/,"").trim()); }
function aiInto(areaId, prompt){
  var area = $(areaId);
  area.innerHTML = '<div class="answer"><span class="spin"></span> 생각하는 중…</div>';
  return callGemini(prompt).then(function(t){ area.innerHTML = '<div class="answer">'+nl(t.trim())+'</div>'; })
    .catch(function(e){ area.innerHTML = '<div class="answer">'+esc(e.message)+'</div>'; });
}

    'JSON 형식: {"found":true,"past":{"look":"옛날 모습","meaning":"담긴 뜻"},"today":{"look":"오늘날 모습","meaning":"담긴 뜻"},"kw":{"past":["영어","한국어"],"today":["영어","한국어"]}}';

  });

/* ================= 사진 검색 (Wikimedia Commons, 한국 사진만) ================= */
var KOREA_RE = /korea|korean|한국|대한민국|조선|joseon|seoul|서울|busan|부산|jeju|제주|hanbok|한복/i;
function stripHtml(h){ var d=document.createElement("div"); d.innerHTML=h||""; return (d.textContent||"").trim(); }
function searchCommons(q){
  if (/[a-z]/i.test(q) && !/korea/i.test(q)) q += " Korea";
  var u = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=20"+
          "&gsrsearch="+encodeURIComponent(q+" filetype:bitmap")+"&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=640";
  return fetchT(u, {}, 12000).then(function(r){ return r.json(); }).then(function(d){
    var pages = d && d.query && d.query.pages ? Object.keys(d.query.pages).map(function(k){ return d.query.pages[k]; }) : [];
    pages.sort(function(a,b){ return (a.index||0)-(b.index||0); });
    return pages.filter(function(p){
      if (!(p.imageinfo && p.imageinfo[0] && p.imageinfo[0].thumburl)) return false;
      var m = p.imageinfo[0].extmetadata || {};
      var text = (p.title||"") + " " + stripHtml(m.Categories && m.Categories.value) + " " + stripHtml(m.ImageDescription && m.ImageDescription.value);
      return KOREA_RE.test(text);   // 한국 관련 사진만
    }).map(function(p){
      var ii = p.imageinfo[0], m = ii.extmetadata || {};
      var artist = stripHtml(m.Artist && m.Artist.value).slice(0,40);
      var lic = m.LicenseShortName ? m.LicenseShortName.value : "";
      return {url:ii.thumburl, page:ii.descriptionurl, credit:"Wikimedia Commons" + (artist ? " · "+artist : "") + (lic ? " · "+lic : "")};
    });
  }).catch(function(){ return []; });
}
function searchExtra(custom, era, info){
  var key = custom+"|"+era;
  if (S.extra[key]) return Promise.resolve(S.extra[key]);
  var other = custom+"|"+(era==="past"?"today":"past");
  var kws = (info && info.kw && info.kw[era]) || [(era==="past"?"전통 ":"")+custom];
  var out = [], chain = Promise.resolve();
  function used(u){
    return out.some(function(o){ return o.url===u; }) ||
           (S.extra[other]||[]).some(function(o){ return o.url===u; }) ||   // 다른 시대 사진과 겹치지 않게
           (S.tphotos[key]||[]).some(function(o){ return o.url===u; });
  }
  kws.forEach(function(q){
    chain = chain.then(function(){
      if (out.length >= 6) return;
      return searchCommons(q).then(function(list){ list.forEach(function(x){ if (out.length < 6 && !used(x.url)) out.push(x); }); });
    });
  });
  return chain.then(function(){ S.extra[key] = out; return out; });
}

function saveResearch(era){

  if (!src){ toast("출처를 꼭 적어요."); $("fSource").focus(); return; }
  var f = {};
  f[era+"_content"] = content; f[era+"_source"] = src;
  f[era+"_image"] = S.pick[era] ? S.pick[era].url : null;

  saveRecord(f).then(function(){
    $("savedMsg").textContent = "저장했어요! ✓"; toast("저장했어요!");

  if (era === "past") f.past_question = null;

    ["fSame","fDiff","fReason","fHeart"].forEach(function(id){ $(id).oninput = drawPreview; });
    $("btnSaveCmp").onclick = saveCompare;
    $("btnHint").onclick = hint;
    $("btnPng").onclick = function(){ exportPng(cmpValues(), whoText()); };
    $("btnClearCmp").onclick = clearCompare;
    $("btnClearAll").onclick = clearAll;
    $("copyBox").ontoggle = function(){ if (this.open) drawCopyList(); };
    drawPreview();
  }).catch(function(){ $("view").innerHTML = '<div class="card" style="margin-top:16px"><div class="empty">기록을 불러오지 못했어요. 인터넷을 확인해요.</div></div>'; });
}
function whoText(){ return S.student.cls+" "+S.student.no+"번 "+S.student.name; }
function valuesFromRow(r){
  return {custom:r.custom, past:r.past_content||"", today:r.today_content||"", same:r.same_point||"", diff:r.diff_point||"",
          reason:r.reason||"", heart:r.heart||"", pastSrc:r.past_source||"", todaySrc:r.today_source||"",
          pastImg:r.past_image||"", todayImg:r.today_image||"", pastCredit:r.past_image_credit||"", todayCredit:r.today_image_credit||""};
}
function cmpValues(){
  var v = valuesFromRow(S.record || {custom:S.custom});
  v.custom = S.custom;
  if ($("fSame")){ v.same=$("fSame").value.trim(); v.diff=$("fDiff").value.trim(); v.reason=$("fReason").value.trim(); v.heart=$("fHeart").value.trim(); }
  return v;
}
function cardHtml(v, who){
  function half(cls, nm, img, txt){
    return '<div class="'+cls+'"><b>'+nm+'</b>'+(img ? '<img src="'+esc(img)+'" crossorigin="anonymous" alt="'+nm+' 사진">' : '<div class="ni">사진 없음</div>')+nl(txt)+'</div>';
  }
  return '<div class="pcard"><div class="ttl">'+esc(v.custom)+' 풍습 비교 카드</div>'+
    '<div class="two">'+half("p","옛날",v.pastImg,v.past)+half("t","오늘날",v.todayImg,v.today)+'</div>'+
    '<div class="row"><b>같은 점</b><span>'+nl(v.same)+'</span></div>'+
    '<div class="row"><b>다른 점</b><span>'+nl(v.diff)+'</span></div>'+
    '<div class="row"><b>달라진 까닭</b><span>'+nl(v.reason)+'</span></div>'+
    '<div class="row"><b>이어지는 마음</b><span>'+nl(v.heart)+'</span></div>'+
    '<div class="foot">출처 · 옛날: '+esc(v.pastSrc)+' / 오늘날: '+esc(v.todaySrc)+
      (v.pastCredit ? '<br>옛날 사진: '+esc(v.pastCredit) : '')+(v.todayCredit ? '<br>오늘날 사진: '+esc(v.todayCredit) : '')+
      (who ? '<br><b>'+esc(who)+'</b>' : '')+'</div></div>';
}
function drawPreview(){
  var el = $("cardPreview"); if (!el) return;
  el.innerHTML = cardHtml(cmpValues(), whoText());
  if ($("copyBox") && $("copyBox").open) drawCopyList();
}
function drawCopyList(){
  if (!$("copyList")) return;
  var v = cmpValues();
  var items = [["제목", v.custom+" 풍습 비교 카드"],["옛날 모습",v.past],["오늘날 모습",v.today],["같은 점",v.same],["다른 점",v.diff],
               ["달라진 까닭",v.reason],["이어지는 마음",v.heart],["출처","옛날: "+v.pastSrc+" / 오늘날: "+v.todaySrc],["만든 사람",whoText()]];
  var all = [];
  $("copyList").innerHTML = items.map(function(it){
    var sents = splitSentences(it[1]);
    if (!sents.length) return "";
    return '<div class="item"><h5>'+esc(it[0])+'</h5>'+sents.map(function(s){
      all.push(s);
      return '<div class="sent"><span>'+esc(s)+'</span><button class="btn ghost xs" data-k="'+(all.length-1)+'">복사</button></div>';
    }).join("")+'</div>';
  }).join("") + '<div class="src-note">사진은 위 카드의 사진을 길게 누르거나 오른쪽 클릭으로 저장해 캔바에 올려요.</div>';
  each("#copyList [data-k]", function(b){ b.onclick = function(){ copyText(all[parseInt(b.getAttribute("data-k"),10)]); }; });
}
function saveCompare(){
  var v = cmpValues();
  if (!v.same && !v.diff){ toast("같은 점이나 다른 점을 먼저 써요."); return; }
  var b = $("btnSaveCmp"); b.disabled = true; b.textContent = "저장 중…";
  saveRecord({same_point:v.same, diff_point:v.diff, reason:v.reason, heart:v.heart})
    .then(function(){ $("savedMsg").textContent = "저장했어요! ✓"; toast("저장했어요!"); })
    .catch(function(){ toast("저장하지 못했어요. 다시 눌러 보세요."); })
    .finally(function(){ b.disabled = false; b.textContent = "저장하기"; });
}
function clearCompare(){
  if (!confirm("같은 점, 다른 점, 달라진 까닭, 이어지는 마음을 지울까요?")) return;
  saveRecord({same_point:null, diff_point:null, reason:null, heart:null}).then(function(){ toast("지웠어요."); render(); })
    .catch(function(){ toast("지우지 못했어요."); });
}
function hint(){
  var v = cmpValues();
  aiInto("hintArea", "너는 초등학교 3학년 학생이 옛날과 오늘날의 풍습을 비교하도록 돕는 선생님이야.\n"+
    "풍습: "+v.custom+"\n학생이 조사한 옛날 모습: "+v.past+"\n학생이 조사한 오늘날 모습: "+v.today+"\n"+
    "학생이 쓴 같은 점: "+(v.same||"(아직 없음)")+"\n다른 점: "+(v.diff||"(아직 없음)")+"\n달라진 까닭: "+(v.reason||"(아직 없음)")+"\n\n"+
    "- 정답을 직접 알려주지 마.\n- 학생이 스스로 같은 점, 다른 점, 달라진 까닭을 생각할 수 있도록 돕는 질문을 2개만 써.\n"+
    "- 학생이 이미 잘 쓴 부분이 있으면 한 문장으로 칭찬하고 시작해.\n- 쉬운 말, 전체 4문장 이내.");
}

/* 카드를 그림 파일(PNG)로 저장 */
function exportPng(v, who){
  if (!window.html2canvas){ toast("이미지 저장 기능을 불러오지 못했어요. 인터넷을 확인해요."); return; }
  toast("카드 그림을 만드는 중…");
  var stage = $("exportStage");
  stage.innerHTML = '<div style="padding:24px;background:#f6efe0">'+cardHtml(v, who)+'</div>';
  var imgs = stage.querySelectorAll("img");
  Promise.all(Array.prototype.map.call(imgs, function(im){
    return im.complete ? Promise.resolve() : new Promise(function(res){ im.onload = res; im.onerror = function(){ im.remove(); res(); }; });
  })).then(function(){
    return html2canvas(stage.firstChild, {useCORS:true, scale:2, backgroundColor:"#f6efe0"});
  }).then(function(canvas){
    var name = "풍습카드_"+v.custom+"_"+(who||"").replace(/\s+/g,"_")+".png";
    canvas.toBlob(function(blob){
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast("카드 그림을 저장했어요. 패들렛에 올려요!");
      stage.innerHTML = "";
    }, "image/png");
  }).catch(function(){ stage.innerHTML = ""; toast("그림을 만들지 못했어요. 다시 해 보세요."); });
}

/* ================= ④ 우리 반 모아보기 ================= */
var boardRows = [];
function renderBoard(){
  $("view").innerHTML = '<div class="card" style="margin-top:16px"><h3>'+esc(S.student.cls.replace("3-","3학년 "))+'반 풍습 탐험 현황 <button class="btn ghost sm" id="btnRefresh" style="margin-left:auto">새로 고침</button></h3><div id="boardArea"><span class="spin"></span> 불러오는 중…</div></div>';
  $("btnRefresh").onclick = renderBoard;
  sb(TABLE+"?class_code=eq."+encodeURIComponent(S.student.cls)+"&select=*").then(function(rows){
    boardRows = rows || [];
    if (!boardRows.length){ $("boardArea").innerHTML = '<div class="empty">아직 저장된 기록이 없어요.</div>'; return; }
    boardRows.sort(function(a,b){
      var ia = CUSTOMS.indexOf(a.custom), ib = CUSTOMS.indexOf(b.custom);
      ia = ia<0?99:ia; ib = ib<0?99:ib;
      return ia-ib || a.student_no-b.student_no;
    });
    function mk(v){ return v ? '<span class="ok">✓</span>' : '<span class="no">–</span>'; }
    $("boardArea").innerHTML = '<table class="board"><thead><tr><th>풍습</th><th>번호</th><th>이름</th><th>오늘날</th><th>옛날</th><th>비교</th><th></th></tr></thead><tbody>'+
      boardRows.map(function(r,i){
        return '<tr><td><b>'+esc(r.custom)+'</b></td><td>'+r.student_no+'</td><td class="l">'+esc(r.student_name)+'</td><td>'+mk(r.today_content)+'</td><td>'+mk(r.past_content)+'</td><td>'+mk(r.same_point||r.diff_point)+'</td>'+
               '<td><button class="btn ghost sm" data-i="'+i+'">카드 보기</button></td></tr>';
      }).join("")+'</tbody></table>';
    each("#boardArea button[data-i]", function(b){ b.onclick = function(){ openCard(boardRows[parseInt(b.getAttribute("data-i"),10)]); }; });
  }).catch(function(){ $("boardArea").innerHTML = '<div class="empty">불러오지 못했어요.</div>'; });
}
function openCard(r){
  var v = valuesFromRow(r), who = r.class_code+" "+r.student_no+"번 "+(r.student_name||"");
  $("modalBox").innerHTML = cardHtml(v, who) +
    '<div class="actions"><button class="btn blue" id="btnPngM">카드 이미지로 저장</button><button class="btn" id="btnClose">닫기</button></div>';
  $("modal").classList.add("show");
  $("btnClose").onclick = function(){ $("modal").classList.remove("show"); };
  $("btnPngM").onclick = function(){ exportPng(v, who); };
}

/* ================= 선생님 메뉴: 풍습별 사진 관리 ================= */
var T = {custom:"출생", era:"past"};
function teacherLogin(){
  var pw = prompt("선생님 비밀번호를 입력하세요.");
  if (pw === null) return;
  sb("settings?key=eq.teacher_password&select=value", {}, 5000).then(function(rows){
    var real = rows && rows[0] ? String(rows[0].value) : null;
    if (!real){ toast("선생님 비밀번호가 설정되어 있지 않아요."); return; }
    if (pw !== real){ toast("비밀번호가 맞지 않아요."); return; }
    $("loginBox").classList.add("hide"); $("main").classList.add("hide"); $("teacher").classList.remove("hide");
    renderTeacher();
  }).catch(function(){ toast("DB에 연결하지 못했어요."); });
}
function renderTeacher(){
  var chips = CUSTOMS.map(function(c){ return '<button class="chip'+(c===T.custom?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'; }).join(" ");
  $("teacher").innerHTML =
    '<div class="card" style="margin-top:20px">'+
      '<h3>선생님 메뉴 · 풍습별 사진 관리 <button class="btn ghost sm" id="btnTBack" style="margin-left:auto">학생 화면으로</button></h3>'+
      '<p class="src-note">여기에 올린 사진이 학생 화면에서 가장 먼저 보여요. 풍습과 시대(옛날/오늘날)를 골라 올려 주세요.</p>'+
      '<div class="chips" style="margin-top:12px"><span class="lbl">풍습</span>'+chips+
        '<div class="searchbox"><input id="tOther" placeholder="다른 풍습 (예: 설날)"><button class="btn sm" id="tOtherBtn">선택</button></div></div>'+
      '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">'+
        '<div class="seg"><button data-e="past" class="'+(T.era==="past"?"on":"")+'">옛날</button><button data-e="today" class="'+(T.era==="today"?"on":"")+'">오늘날</button></div>'+
        '<b style="font-size:18px">'+esc(T.custom)+' · '+ERA_NAME[T.era]+'</b>'+
      '</div>'+
      '<label class="f">사진 출처 <small>예) 국립민속박물관, 국가유산포털</small></label>'+
      '<input class="inp" id="tCredit" placeholder="사진 출처">'+
      '<div class="actions"><label class="btn red filebtn">사진 올리기 (여러 장 가능)<input type="file" accept="image/*" multiple id="tFiles"></label><span class="saved" id="tMsg"></span></div>'+
      '<div id="tList" style="margin-top:14px"><span class="spin"></span></div>'+
    '</div>';
  each("#teacher .chip", function(b){ b.onclick = function(){ T.custom = b.getAttribute("data-c"); renderTeacher(); }; });
  $("tOtherBtn").onclick = function(){ var v=$("tOther").value.trim(); if(v){ T.custom=v; renderTeacher(); } };
  each("#teacher .seg button", function(b){ b.onclick = function(){ T.era = b.getAttribute("data-e"); renderTeacher(); }; });
  $("btnTBack").onclick = function(){ $("teacher").classList.add("hide"); if (S.student) showMain(); else $("loginBox").classList.remove("hide"); };
  $("tFiles").onchange = function(){ teacherUpload(this); };
  drawTeacherList();
}
function drawTeacherList(){
  getTeacherPhotos(T.custom, T.era, true).then(function(list){
    if (!list.length){ $("tList").innerHTML = '<div class="empty" style="padding:20px">아직 올린 사진이 없어요. 사진이 없으면 학생 화면에서 자동 검색 사진이 보여요.</div>'; return; }
    $("tList").innerHTML = '<div class="imgs" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">'+list.map(function(x,i){
      return '<div class="imgcard"><img src="'+esc(x.url)+'" alt="사진"><div class="cap">'+esc(x.credit||"")+'</div><button data-del="'+i+'">삭제</button></div>';
    }).join("")+'</div>';
    each("#tList [data-del]", function(b){
      b.onclick = function(){
        var x = list[parseInt(b.getAttribute("data-del"),10)];
        if (!confirm("이 사진을 삭제할까요?")) return;
        sb(PHOTO_TABLE+"?id=eq."+x.id, {method:"DELETE"}).then(function(){ return removeStorage(x.path); })
          .then(function(){ toast("삭제했어요."); drawTeacherList(); })
          .catch(function(){ toast("삭제하지 못했어요."); });
      };
    });
  });
}
function teacherUpload(input){
  var files = Array.prototype.slice.call(input.files || []); input.value = "";
  if (!files.length) return;
  var credit = $("tCredit").value.trim() || "선생님 자료";
  var done = 0, chain = Promise.resolve();
  $("tMsg").textContent = "올리는 중… 0/"+files.length;
  files.forEach(function(f){
    chain = chain.then(function(){
      return uploadImage(f, "teacher/"+folderKey(T.custom)+"-"+T.era).then(function(r){
        return sb(PHOTO_TABLE, {method:"POST", body:[{custom:T.custom, era:T.era, url:r.url, path:r.path, credit:credit}]});
      }).then(function(){ done++; $("tMsg").textContent = "올리는 중… "+done+"/"+files.length; })
        .catch(function(){ toast("올리지 못한 사진이 있어요."); });
    });
  });
  chain.then(function(){ $("tMsg").textContent = done+"장 올렸어요 ✓"; S.tphotos = {}; drawTeacherList(); });
}

/* ================= 시작 ================= */
function init(){
  fillSelects();
  $("btnLogin").onclick = login;
  $("inName").onkeydown = function(e){ if (e.key==="Enter") login(); };
  $("btnTeacher").onclick = teacherLogin;
  $("btnSearch").onclick = doSearch;
  $("inSearch").onkeydown = function(e){ if (e.key==="Enter") doSearch(); };
  each(".tab", function(b){ b.onclick = function(){ switchTab(b.getAttribute("data-tab")); }; });
  $("modal").onclick = function(e){ if (e.target === this) this.classList.remove("show"); };

  loadGeminiKey();
  var saved = store("cc_student");
  if (saved){
    try{ S.student = JSON.parse(saved); }catch(e){ S.student = null; }
    if (S.student && S.student.no && /^3-[1-6]$/.test(S.student.cls)){
      $("inClass").value = S.student.cls; $("inNo").value = S.student.no; $("inName").value = S.student.name;
      showMain();
    } else S.student = null;
  }
}
init();
</script>
